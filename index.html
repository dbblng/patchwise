<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Patchwise">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111">
<title>Patchwise</title>
<link rel="stylesheet" href="styles.css?v=20261126b">
</head>
<body>
  <div class="app">
    <h1>🛹 Patchwise</h1>
    <p class="subtitle">Surface conditions for any spot, instantly.</p>
    <p id="algo-version" class="algo-version"></p>

    <div class="input-row search-row">
      <button id="gps-btn" class="btn btn-icon" title="Use my location">📍</button>
      <input type="text" id="search-input" placeholder="Search a place or address…">
      <button id="search-btn" class="btn">Search</button>
    </div>
    <div id="search-results" class="search-results hidden"></div>

    <div id="status" class="status"></div>

    <div id="result" class="result hidden"></div>

    <div id="observed-block" class="observed-block hidden">
      <div class="observed-label">What do you see?</div>
      <div class="observed-buttons">
        <button class="obs-btn" data-status="Dry">🟢 Dry</button>
        <button class="obs-btn" data-status="Patchy">🟡 Patchy</button>
        <button class="obs-btn" data-status="Wet">🔴 Wet</button>
      </div>
      <textarea id="notes-input" class="notes-input" placeholder="Optional notes…" rows="2"></textarea>
    </div>

    <div id="copy-row" class="copy-row hidden">
      <button id="send-btn" class="btn btn-primary">✅ Send observation</button>
      <button id="copy-btn" class="btn btn-secondary">📋 Copy data</button>
      <button id="reset-btn" class="btn btn-secondary">🔄 Reset</button>
      <span id="copy-confirm" class="copy-confirm hidden">Copied!</span>
    </div>

    <div id="forecast-strip" class="forecast-strip hidden"></div>
    <div id="forecast-detail" class="forecast-detail hidden"></div>
  </div>

  <!-- Bump ?v= on EVERY push to this repo (e.g. to today's date, incrementing a/b/c/...
       for same-day pushes) — without it, phones/browsers can keep serving a cached
       copy indefinitely even after GitHub Pages has the new file (found 2026-11-14,
       cost a day of confusing field-test mismatches). -->
  <script src="weatherModule.js?v=20261126b"></script>
  <script src="app.js?v=20261126b"></script>
</body>
</html>
